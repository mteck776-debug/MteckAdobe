<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quire PDF Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital,opsz,wght@1,9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: quiet chrome on three sides of a cutting-mat workspace; the pages are the only white on screen. */
  --chrome:#f1f4f0; --panel:#e4e9e3; --ink:#16211d; --muted:#586660; --line:#cbd4cd;
  --mat:#2d5a4d; --mat-grid:rgba(255,255,255,.08); --mat-grid-strong:rgba(255,255,255,.16);
  --accent:#1c6a57; --accent-ink:#ffffff; --guide:#0095c2; --danger:#b3261e; --field:#e3efff;
  --f-display:"Fraunces",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chrome:#18211e; --panel:#212c28; --ink:#e7eeea; --muted:#9aaba3; --line:#34443d;
    --mat:#12261f; --mat-grid:rgba(255,255,255,.05); --mat-grid-strong:rgba(255,255,255,.1);
    --accent:#57c2a6; --accent-ink:#0c1a16; --guide:#3fc4ec; --danger:#f2867e; --field:#e3efff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chrome:#18211e; --panel:#212c28; --ink:#e7eeea; --muted:#9aaba3; --line:#34443d;
  --mat:#12261f; --mat-grid:rgba(255,255,255,.05); --mat-grid-strong:rgba(255,255,255,.1);
  --accent:#57c2a6; --accent-ink:#0c1a16; --guide:#3fc4ec; --danger:#f2867e; --field:#e3efff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--ink);font:14px/1.4 var(--f-body);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--guide);outline-offset:1px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mark{font:italic 600 24px/1 var(--f-display);letter-spacing:-.01em;margin-right:4px}
.mark small{font:500 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:6px;font-style:normal}
#fname{font:500 13px var(--f-mono);color:var(--muted);max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1 1 0;min-width:0}
.grp{display:flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line);background:transparent;border-radius:6px;white-space:nowrap}
.btn:hover{background:var(--panel)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sq{width:32px;padding:0;justify-content:center}
#zoomv{font:500 12px var(--f-mono);min-width:5ch;text-align:center;font-variant-numeric:tabular-nums}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:36px;z-index:30;background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none}
.menu-pop.open{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:5px}
.menu-pop button:hover{background:var(--panel)}

/* tool bar */
#tools{display:flex;align-items:stretch;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:5px 6px 4px;border:1px solid transparent;border-radius:6px;background:transparent;font-size:11px;line-height:1.1;white-space:nowrap}
.tool:hover{background:var(--panel)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sep{width:1px;background:var(--line);margin:4px 6px;flex:none}
#props{display:flex;align-items:center;gap:10px;padding-left:4px;white-space:nowrap}
#props label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
#props input[type=number]{width:56px;height:28px;border:1px solid var(--line);border-radius:5px;background:transparent;padding:0 6px;font-family:var(--f-mono)}
#props select{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--chrome);padding:0 4px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--chrome),0 0 0 4px var(--guide)}
#p-custom{width:26px;height:26px;padding:0;border:0;background:none}
.tog{width:28px;height:28px;border:1px solid var(--line);border-radius:5px;background:transparent;font-weight:600}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--chrome)}
[hidden]{display:none!important}

/* work area */
#work{flex:1 1 0;display:flex;min-height:0}
#side{width:168px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#sideops{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--line)}
#sideops .btn{width:auto;height:30px;padding:0;justify-content:center}
#thumbs{flex:1 1 0;overflow-y:auto;padding:10px 8px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
.th{position:relative;padding:5px 5px 3px;border-radius:6px;border:2px solid transparent;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent}
.th .tbox{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);overflow:hidden}
.th img{position:absolute;left:0;top:0;transform-origin:0 0;display:block;max-width:none}
.th .n{font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.th.sel{border-color:var(--guide);background:color-mix(in srgb,var(--guide) 14%,transparent)}
.th.cur .n{color:var(--ink);font-weight:600}
.th.drop-before::before,.th.drop-after::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--guide);border-radius:2px}
.th.drop-before::before{top:-7px}.th.drop-after::after{bottom:-7px}
#stage{flex:1 1 0;min-width:0;overflow:auto;position:relative;background-color:var(--mat);
  background-image:linear-gradient(var(--mat-grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid-strong) 1px,transparent 1px),linear-gradient(var(--mat-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-attachment:local}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:26px 16px 80px;min-width:min-content}
.pg{position:relative;flex:none;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15),0 10px 28px rgba(0,0,0,.35)}
.pg-in{position:absolute;left:0;top:0;transform-origin:0 0}
.pg canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.ov{position:absolute;left:0;top:0;transform-origin:0 0;color:#111}
body.creating .ov{cursor:crosshair;touch-action:none}
body.creating .ov [data-aid]{pointer-events:none!important}
body.t-text .ov{cursor:text}
.a{position:absolute}
.a-text{white-space:pre;line-height:1.2;min-width:3px;min-height:1em;cursor:move;user-select:none;-webkit-user-select:none}
.a-text.editing{cursor:text;user-select:text;-webkit-user-select:text;outline:1px dashed #0095c2;outline-offset:2px;background:rgba(255,255,255,.6)}
.a-box{cursor:move}
.a-img{cursor:move;user-select:none;-webkit-user-drag:none}
svg.a-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.a-svg .hit{pointer-events:stroke;cursor:move;stroke:transparent;fill:none}
.selbox{position:absolute;border:1px solid #0095c2;pointer-events:none}
.hd{position:absolute;background:#fff;border:1.5px solid #0095c2;border-radius:50%;pointer-events:auto}
.thit{position:absolute;border:1px dashed transparent;cursor:text;border-radius:1px}
.thit:hover{border-color:#0095c2;background:rgba(0,149,194,.12)}
.ff{position:absolute;border:0;margin:0;padding:0 2px;background:var(--field);color:#0b1b33;font-family:Arial,Helvetica,sans-serif;border-radius:1px;outline-offset:0}
textarea.ff{resize:none;padding:2px}
button.ff{display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1}

/* status */
#status{display:flex;gap:14px;align-items:center;padding:5px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#hint{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pageno{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:9px 14px;border-radius:8px;max-width:min(560px,calc(100% - 32px));box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:60;display:none}
#toast.show{display:block}
#drop{position:fixed;inset:0;background:color-mix(in srgb,var(--mat) 86%,transparent);color:#fff;display:none;align-items:center;justify-content:center;font:italic 600 30px var(--f-display);z-index:70;pointer-events:none}
#drop.show{display:flex}

/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.open{display:flex}
.dlg{background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font:italic 600 22px var(--f-display);text-wrap:balance}
.dlg .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px}
.tabs .btn[aria-pressed="true"]{background:var(--ink);color:var(--chrome);border-color:var(--ink)}
#sigpad{width:100%;height:180px;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair;display:block}
#sigtext,#pwin{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:0 10px}
#sigprev{height:90px;background:#fff;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#sigprev canvas{max-width:100%;max-height:100%}
#siglast img{height:44px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}

#sidetog{display:none}
@media (max-width:720px){
  #side{position:absolute;z-index:20;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .15s}
  #work{position:relative}
  #side.open{transform:none;box-shadow:6px 0 20px rgba(0,0,0,.3)}
  #sidetog{display:inline-flex}
  #fname{display:none}
  .btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
</style>
</head>
<body>

<header id="top">
  <div class="mark">Quire<small>PDF editor</small></div>
  <button class="btn" id="sidetog" type="button">Pages</button>
  <div id="fname" title="">sample.pdf</div>
  <div class="grow"></div>
  <div class="grp">
    <button class="btn" id="b-open" type="button" title="Open a PDF (Ctrl+O)"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7v11h18V9h-9l-2-2z"/></svg><span class="lbl">Open</span></button>
    <button class="btn" id="b-add" type="button" title="Add PDFs or images as extra pages"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Add pages</span></button>
  </div>
  <div class="grp">
    <button class="btn sq" id="b-undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5L3 10l5 5M3 10h11a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn sq" id="b-redo" type="button" title="Redo (Ctrl+Y)" aria-label="Redo"><svg class="ic" viewBox="0 0 24 24"><path d="M16 5l5 5-5 5M21 10H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>
  <div class="grp">
    <button class="btn sq" id="b-zout" type="button" aria-label="Zoom out">−</button>
    <span id="zoomv">100%</span>
    <button class="btn sq" id="b-zin" type="button" aria-label="Zoom in">+</button>
    <button class="btn" id="b-fit" type="button" title="Fit page width">Fit</button>
  </div>
  <div class="grp menu">
    <button class="btn pri" id="b-save" type="button" title="Save the edited PDF (Ctrl+S)"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>Save PDF</button>
    <button class="btn sq" id="b-more" type="button" aria-label="More save options" aria-haspopup="true">▾</button>
    <div class="menu-pop" id="savemenu">
      <button type="button" id="m-extract">Save selected pages as a new PDF</button>
      <button type="button" id="m-png">Save current page as a PNG image</button>
    </div>
  </div>
</header>

<div id="tools" role="toolbar" aria-label="Editing tools">
  <button class="tool" type="button" data-tool="select"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3l12 9-5 1 3 6-2 1-3-6-4 3z"/></svg>Select</button>
  <button class="tool" type="button" data-tool="edit"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg>Edit text</button>
  <button class="tool" type="button" data-tool="text"><svg class="ic" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg>Add text</button>
  <button class="tool" type="button" data-tool="highlight"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20h16M8 15l8-10 3 2.5-8 10H8z"/></svg>Highlight</button>
  <button class="tool" type="button" data-tool="pen"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17c3-9 5 4 8-3s4-6 6-2 2 4 4 2"/></svg>Draw</button>
  <button class="tool" type="button" data-tool="shape"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h10v10H4z"/><circle cx="16" cy="16" r="4.5"/></svg>Shape</button>
  <button class="tool" type="button" data-tool="tick"><svg class="ic" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>Tick</button>
  <button class="tool" type="button" data-tool="whiteout"><svg class="ic" viewBox="0 0 24 24"><path d="M4 15l8-9 7 6-6 7H8zM4 20h16"/></svg>Whiteout</button>
  <button class="tool" type="button" data-tool="redact"><svg class="ic" viewBox="0 0 24 24"><path d="M3 9h18v6H3z" fill="currentColor"/></svg>Redact</button>
  <button class="tool" type="button" id="t-image"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4"/><circle cx="15.5" cy="9.5" r="1"/></svg>Image</button>
  <button class="tool" type="button" id="t-sign"><svg class="ic" viewBox="0 0 24 24"><path d="M3 16c4-11 6-10 6-4s3 0 5-2 2 5 7 2M3 21h18"/></svg>Sign</button>
  <div class="sep"></div>
  <div id="props">
    <span id="p-colors" class="grp" hidden>
      <button class="sw" type="button" data-c="#111111" style="background:#111111" aria-label="Black"></button>
      <button class="sw" type="button" data-c="#d4281a" style="background:#d4281a" aria-label="Red"></button>
      <button class="sw" type="button" data-c="#1a56d4" style="background:#1a56d4" aria-label="Blue"></button>
      <button class="sw" type="button" data-c="#1f8a4c" style="background:#1f8a4c" aria-label="Green"></button>
      <button class="sw" type="button" data-c="#ffd84a" style="background:#ffd84a" aria-label="Yellow"></button>
      <button class="sw" type="button" data-c="#ffffff" style="background:#ffffff" aria-label="White"></button>
      <input type="color" id="p-custom" value="#111111" aria-label="Custom colour">
    </span>
    <label id="p-kind-l" hidden>Shape <select id="p-kind"><option value="rect">Rectangle</option><option value="ellipse">Ellipse</option><option value="line">Line</option><option value="arrow">Arrow</option></select></label>
    <label id="p-font-l" hidden>Font <select id="p-font"><option value="helv">Helvetica</option><option value="times">Times</option><option value="cour">Courier</option></select></label>
    <label id="p-size-l" hidden><span id="p-size-t">Size</span> <input type="number" id="p-size" min="1" max="200" step="1" value="14"></label>
    <span id="p-style" class="grp" hidden>
      <button class="tog" type="button" id="p-bold" aria-label="Bold">B</button>
      <button class="tog" type="button" id="p-ital" aria-label="Italic" style="font-style:italic">I</button>
    </span>
    <button class="btn" type="button" id="p-del" hidden>Delete</button>
  </div>
</div>

<div id="work">
  <aside id="side" aria-label="Pages">
    <div id="sideops">
      <button class="btn" type="button" id="o-rl" title="Rotate left" aria-label="Rotate selected pages left"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5v5h5M5 10a8 8 0 1 1 2 8"/></svg></button>
      <button class="btn" type="button" id="o-rr" title="Rotate right" aria-label="Rotate selected pages right"><svg class="ic" viewBox="0 0 24 24"><path d="M20 5v5h-5M19 10a8 8 0 1 0-2 8"/></svg></button>
      <button class="btn" type="button" id="o-up" title="Move up" aria-label="Move selected pages up"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      <button class="btn" type="button" id="o-dn" title="Move down" aria-label="Move selected pages down"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      <button class="btn" type="button" id="o-dup" title="Duplicate" aria-label="Duplicate selected pages"><svg class="ic" viewBox="0 0 24 24"><path d="M8 8h11v12H8zM5 16V4h10"/></svg></button>
      <button class="btn" type="button" id="o-blank" title="Insert blank page" aria-label="Insert a blank page"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM12 10v6M9 13h6"/></svg></button>
      <button class="btn" type="button" id="o-all" title="Select all pages" aria-label="Select all pages"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 12l3 3 5-6"/></svg></button>
      <button class="btn" type="button" id="o-del" title="Delete pages" aria-label="Delete selected pages"><svg class="ic" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
    </div>
    <div id="thumbs"></div>
  </aside>
  <main id="stage"><div id="pages"></div></main>
</div>

<footer id="status">
  <span id="hint"></span>
  <span>Files stay on this device</span>
  <span id="pageno">Page 1 / 1</span>
</footer>

<div id="toast" role="status" aria-live="polite"></div>
<div id="drop">Drop to open</div>
<input type="file" id="f-open" accept="application/pdf,.pdf" hidden>
<input type="file" id="f-add" accept="application/pdf,.pdf,image/*" multiple hidden>
<input type="file" id="f-img" accept="image/*" hidden>

<div class="scrim" id="sigdlg" role="dialog" aria-modal="true" aria-labelledby="sig-h">
  <div class="dlg">
    <h2 id="sig-h">Add your signature</h2>
    <div class="row">
      <div class="tabs"><button class="btn" type="button" id="sig-tab-draw" aria-pressed="true">Draw</button><button class="btn" type="button" id="sig-tab-type" aria-pressed="false">Type</button></div>
      <div class="grow"></div>
      <label>Ink <select id="sig-ink"><option value="#111111">Black</option><option value="#12339b">Blue</option></select></label>
    </div>
    <div id="sig-draw"><canvas id="sigpad" width="1000" height="360"></canvas></div>
    <div id="sig-type" hidden><input type="text" id="sigtext" placeholder="Type your name" autocomplete="off"><div id="sigprev" style="margin-top:8px"></div></div>
    <div class="row" id="siglast" hidden><span>Last used</span><img alt="Your last signature"><button class="btn" type="button" id="sig-uselast">Use this one</button></div>
    <div class="row">
      <button class="btn" type="button" id="sig-clear">Clear</button>
      <div class="grow"></div>
      <button class="btn" type="button" id="sig-cancel">Cancel</button>
      <button class="btn pri" type="button" id="sig-ok">Place signature</button>
    </div>
  </div>
</div>

<div class="scrim" id="pwdlg" role="dialog" aria-modal="true" aria-labelledby="pw-h">
  <form class="dlg" id="pwform">
    <h2 id="pw-h">This PDF needs a password</h2>
    <input type="password" id="pwin" placeholder="Password" autocomplete="off">
    <div class="row"><div class="grow"></div><button class="btn" type="button" id="pw-cancel">Cancel</button><button class="btn pri" type="submit">Open</button></div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
